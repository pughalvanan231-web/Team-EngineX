services:
  # Backend FastAPI Service
  - type: web
    name: nova-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_DIR
        value: "/var/data/interviews"
      - key: AI_PROVIDER
        value: "demo" # Change to "groq" or "openai" and add API keys if not using demo mode
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1

  # Frontend React Service
  - type: web
    name: nova-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          name: nova-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
